name: kafka-poc

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

x-healthcheck-controller: &healthcheck-controller
  test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/9093'"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-healthcheck-broker: &healthcheck-broker
  test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/19092'"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-healthcheck-connect: &healthcheck-connect
  test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/8083'"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  # ----------------------------
  # KRaft Controllers (3)
  # ----------------------------
  controller-1:
    image: apache/kafka:4.1.1
    container_name: controller-1
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 120s
    stop_signal: SIGTERM
    healthcheck: *healthcheck-controller
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
    volumes:
      - controller_1_data:/var/lib/kafka/data

  controller-2:
    image: apache/kafka:4.1.1
    container_name: controller-2
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 120s
    stop_signal: SIGTERM
    healthcheck: *healthcheck-controller
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
    volumes:
      - controller_2_data:/var/lib/kafka/data

  controller-3:
    image: apache/kafka:4.1.1
    container_name: controller-3
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 120s
    stop_signal: SIGTERM
    healthcheck: *healthcheck-controller
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
    volumes:
      - controller_3_data:/var/lib/kafka/data

  # ----------------------------
  # Brokers (3)
  # INTERNAL listener is for Docker network + inter-broker traffic
  # EXTERNAL is for your host machine (or your laptop via SSH)
  # ----------------------------
  broker-1:
    image: apache/kafka:4.1.1
    container_name: broker-1
    restart: unless-stopped
    depends_on:
      controller-1:
        condition: service_healthy
      controller-2:
        condition: service_healthy
      controller-3:
        condition: service_healthy
    logging: *default-logging
    stop_grace_period: 120s
    stop_signal: SIGTERM
    healthcheck: *healthcheck-broker
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      # If you're on a remote VM, set PUBLIC_HOST to the VM IP/DNS (not localhost)
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://172.16.232.50:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
    volumes:
      - broker_1_data:/var/lib/kafka/data

  broker-2:
    image: apache/kafka:4.1.1
    container_name: broker-2
    restart: unless-stopped
    depends_on:
      controller-1:
        condition: service_healthy
      controller-2:
        condition: service_healthy
      controller-3:
        condition: service_healthy
    logging: *default-logging
    stop_grace_period: 120s
    stop_signal: SIGTERM
    healthcheck: *healthcheck-broker
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://172.16.232.50:39092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
    volumes:
      - broker_2_data:/var/lib/kafka/data

  broker-3:
    image: apache/kafka:4.1.1
    container_name: broker-3
    restart: unless-stopped
    depends_on:
      controller-1:
        condition: service_healthy
      controller-2:
        condition: service_healthy
      controller-3:
        condition: service_healthy
    logging: *default-logging
    stop_grace_period: 120s
    stop_signal: SIGTERM
    healthcheck: *healthcheck-broker
    ports:
      - "49092:9092"
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://172.16.232.50:49092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
    volumes:
      - broker_3_data:/var/lib/kafka/data


  # ----------------------------
  # Download MongoDB Kafka Connector "all" (uber) JAR into a shared volume
  # Mongo docs recommend the "all" jar for Connect plugin installs. :contentReference[oaicite:4]{index=4}
  # ----------------------------
  connect-plugins:
    image: curlimages/curl:8.6.0
    container_name: connect-plugins
    restart: "no"
    logging: *default-logging
    command: >
      sh -lc "
        set -e;
        mkdir -p /plugins/mongodb;
        echo 'Downloading MongoDB Kafka Connector...';
        curl -fL
          -o /plugins/mongodb/mongo-kafka-connect-2.0.2-all.jar
          https://repo1.maven.org/maven2/org/mongodb/kafka/mongo-kafka-connect/2.0.2/mongo-kafka-connect-2.0.2-all.jar;
        echo 'Done.';
      "
    volumes:
      # Use host bind so Connect sees the same plugin directory
      - ./connect-plugins:/plugins

  # ----------------------------
  # Kafka Connect (Distributed)
  # - Built-in FileStreamSinkConnector will write to ./lake as your "data lake" landing zone
  # - Mongo sink connector is available via the plugin we downloaded
  # ----------------------------
  connect:
    image: apache/kafka:4.1.1
    container_name: connect
    restart: unless-stopped
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
    logging: *default-logging
    healthcheck: *healthcheck-connect
    ports:
      - "8083:8083"
    volumes:
      - ./connect-plugins:/opt/kafka/plugins
      - ./lake:/lake
      - ./connect/connect-distributed.properties:/opt/kafka/config/connect-distributed.properties
    command: >
      /opt/kafka/bin/connect-distributed.sh
      /opt/kafka/config/connect-distributed.properties

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "19000:9000"   # S3 API
      - "19001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      default: {}
      lakehouse_net:
        aliases:
          - warehouse.minio
# ----------------------------
# Optional Kafka UI (handy but not required)
# ----------------------------
  
    # 2) Kafbat UI (same UI lineage, active fork) on 7001
  kafka-ui-kafbat:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui-kafbat
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7001:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Use all brokers to avoid single-node dependency
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      KAFKA_CLUSTERS_0_READONLY: "false"
      # Optional: enables editing cluster config from UI wizard (not required for topic create)
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      broker-1:
        condition: service_healthy
      connect:
        condition: service_healthy

#Spark + Iceberg REST + bucket init

  postgres:
    image: postgres:16
    container_name: iceberg-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - lakehouse_net

  rest:
    image: iceberg-rest-postgres
    build: ./rest
    container_name: rest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    entrypoint:
      - java
      - -cp
      - /usr/lib/iceberg-rest/iceberg-rest-adapter.jar:/usr/lib/iceberg-rest/postgresql.jar
      - org.apache.iceberg.rest.RESTCatalogServer
    ports:
      - "8182:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_JDBC_SCHEMA__VERSION: V1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_SSL_ENABLED: "false"
      CATALOG_S3_REGION: us-east-1
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
    networks:
      - default
      - lakehouse_net

  mc:
    image: minio/mc
    container_name: mc
    depends_on:
      - minio
    restart: "no"
    logging: *default-logging
    networks:
      - default
      - lakehouse_net
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      tail -f /dev/null
      "

  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: bronze-to-silver
    restart: "no"
    logging: *default-logging
    # Resource caps to prevent Kafka/KRaft starvation under load
    cpus: "1.5"
    mem_limit: 2g
    depends_on:
      - rest
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      # Kafka (MinIO event notifications)
      KAFKA_BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      KAFKA_TOPIC: minio.object.events
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./config:/opt/spark/config:ro
      - ./config:/opt/spark/config:ro
      - ./jars:/opt/spark/jars-extra:ro
    ports:
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
      - "8888:8888"   # Jupyter notebooks (optional)
      - "18080:8080"  # Spark UI (mapped to 18080 to avoid surprises)
      - "10000:10000" # Spark Thrift server (optional)
      - "10001:10001"
    networks:
      - lakehouse_net
      - default
    entrypoint:
      - spark-submit
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.1,org.apache.hadoop:hadoop-aws:3.3.4,software.amazon.awssdk:bundle:2.24.8,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5
      - --conf
      - spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
      - --conf
      - spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
      - --conf
      - spark.sql.catalog.iceberg.type=rest
      - --conf
      - spark.sql.catalog.iceberg.uri=http://rest:8181
      - --conf
      - spark.sql.catalog.iceberg.warehouse=s3://warehouse/
      - --conf
      - spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
      - --conf
      - spark.sql.catalog.iceberg.s3.endpoint=http://minio:9000
      - --conf
      - spark.sql.catalog.iceberg.s3.path-style-access=true
      - --conf
      - spark.sql.catalog.iceberg.s3.access-key-id=minioadmin
      - --conf
      - spark.sql.catalog.iceberg.s3.secret-access-key=minioadmin
      - --conf
      - spark.sql.catalog.iceberg.s3.ssl.enabled=false
      - --conf
      - spark.sql.files.ignoreMissingFiles=true
      - --conf
      - spark.sql.files.ignoreCorruptFiles=true
      - /opt/spark/scripts/bronze/bronze_assets_to_silver_assets.py

  spark-iceberg-shell:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg-shell
    restart: unless-stopped
    logging: *default-logging
    cpus: "1.0"
    mem_limit: 1g
    depends_on:
      - rest
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./scripts:/opt/spark/scripts
    networks:
      - lakehouse_net
      - default
    entrypoint:
      - /bin/sh
      - -lc
      - tail -f /dev/null

  bronze-current:
    image: tabulario/spark-iceberg
    container_name: bronze-current
    restart: unless-stopped
    logging: *default-logging
    cpus: "1.0"
    mem_limit: 1.5g
    depends_on:
      - rest
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      BRONZE_CURRENT_INTERVAL_SECONDS: "60"
    volumes:
      - ./scripts:/opt/spark/scripts
    networks:
      - lakehouse_net
      - default
    entrypoint:
      - /bin/sh
      - -lc
      - |
        DRIVER_HOST="$(hostname -i | awk '{print $1}')";
        /opt/spark/bin/spark-submit \
          --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.1,org.apache.hadoop:hadoop-aws:3.3.4,software.amazon.awssdk:bundle:2.24.8,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5 \
          --conf spark.driver.memory=512m \
          --conf spark.executor.memory=512m \
          --conf spark.sql.shuffle.partitions=4 \
          --conf spark.default.parallelism=4 \
          --conf spark.driver.bindAddress=0.0.0.0 \
          --conf spark.driver.host=$$DRIVER_HOST \
          --conf spark.network.timeout=300s \
          --conf spark.executor.heartbeatInterval=60s \
          --conf spark.sql.files.ignoreMissingFiles=true \
          --conf spark.sql.files.ignoreCorruptFiles=true \
          --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
          --conf spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog \
          --conf spark.sql.catalog.iceberg.type=rest \
          --conf spark.sql.catalog.iceberg.uri=http://rest:8181 \
          --conf spark.sql.catalog.iceberg.warehouse=s3://warehouse/ \
          --conf spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO \
          --conf spark.sql.catalog.iceberg.s3.endpoint=http://minio:9000 \
          --conf spark.sql.catalog.iceberg.s3.path-style-access=true \
          --conf spark.sql.catalog.iceberg.s3.access-key-id=minioadmin \
          --conf spark.sql.catalog.iceberg.s3.secret-access-key=minioadmin \
          --conf spark.sql.catalog.iceberg.s3.ssl.enabled=false \
          /opt/spark/scripts/bronze/bronze_raw_to_bronze_current.py

  spark-schema-infer:
    image: tabulario/spark-iceberg
    container_name: spark-schema-infer
    # Resource caps to keep streaming schema inference lightweight
    cpus: "0.75"
    mem_limit: 1g
    logging: *default-logging
    depends_on:
      - rest
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      # Explicit Kafka bootstrap so it's visible in the container env
      KAFKA_BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      KAFKA_TOPIC: minio.object.events
      # Testing: infer schema from a single latest file
      MAX_FILES_FOR_INFERENCE: "20"
      # Allow inference even if only one new file arrived
      MIN_NEW_FILES_TO_INFER: "1"
      # Read all records from the selected files for more complete schema
      SAMPLING_RATIO: "1"
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./jars:/opt/spark/jars-extra:ro
    networks:
      - default
      - lakehouse_net
    # Memory caps for lightweight schema inference to reduce swap pressure
    entrypoint:
      - spark-submit
      - --jars
      - /opt/spark/jars-extra/iceberg-spark-runtime-3.5_2.12-1.5.1.jar,/opt/spark/jars-extra/hadoop-aws-3.3.4.jar,/opt/spark/jars-extra/aws-java-sdk-bundle-1.12.262.jar,/opt/spark/jars-extra/spark-sql-kafka-0-10_2.12-3.5.5.jar,/opt/spark/jars-extra/spark-token-provider-kafka-0-10_2.12-3.5.5.jar,/opt/spark/jars-extra/kafka-clients-3.4.1.jar,/opt/spark/jars-extra/lz4-java-1.8.0.jar,/opt/spark/jars-extra/snappy-java-1.1.10.5.jar,/opt/spark/jars-extra/slf4j-api-2.0.7.jar,/opt/spark/jars-extra/hadoop-client-runtime-3.3.4.jar,/opt/spark/jars-extra/hadoop-client-api-3.3.4.jar,/opt/spark/jars-extra/commons-logging-1.1.3.jar,/opt/spark/jars-extra/jsr305-3.0.0.jar,/opt/spark/jars-extra/commons-pool2-2.11.1.jar,/opt/spark/jars-extra/wildfly-openssl-1.0.7.Final.jar,/opt/spark/jars-extra/bundle-2.24.8.jar
      - --conf
      - spark.driver.memory=512m
      - --conf
      - spark.executor.memory=512m
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.default.parallelism=4
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.driver.host=127.0.0.1
      - --conf
      - spark.network.timeout=300s
      - --conf
      - spark.executor.heartbeatInterval=60s
      # Fail-safe: skip missing/corrupt files if MinIO events arrive early or files are transient
      - --conf
      - spark.sql.files.ignoreMissingFiles=true
      - --conf
      - spark.sql.files.ignoreCorruptFiles=true
      - --conf
      - spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
      - --conf
      - spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
      - --conf
      - spark.sql.catalog.iceberg.type=hadoop
      - --conf
      - spark.sql.catalog.iceberg.warehouse=s3a://warehouse/iceberg
      - --conf
      - spark.hadoop.fs.s3a.endpoint=http://minio:9000
      - --conf
      - spark.hadoop.fs.s3a.access.key=minioadmin
      - --conf
      - spark.hadoop.fs.s3a.secret.key=minioadmin
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      - --conf
      - spark.hadoop.fs.s3a.connection.ssl.enabled=false
      - /opt/spark/scripts/schema_inferer.py


