# Spark defaults for Livy sessions
spark.master                          spark://spark-master:7077
spark.submit.deployMode               client
spark.driver.bindAddress              0.0.0.0
spark.driver.host                     livy

spark.driver.memory                   1g
spark.executor.memory                 1g
spark.sql.shuffle.partitions          4
spark.default.parallelism             4
spark.network.timeout                 300s
spark.executor.heartbeatInterval      60s

# Iceberg REST catalog + MinIO (matches existing Spark jobs)
spark.sql.extensions                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg             org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type        rest
spark.sql.catalog.iceberg.uri         http://rest:8181
spark.sql.catalog.iceberg.warehouse   s3://warehouse/
spark.sql.catalog.iceberg.io-impl     org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.s3.access-key-id     minioadmin
spark.sql.catalog.iceberg.s3.secret-access-key minioadmin
spark.sql.catalog.iceberg.s3.ssl.enabled       false

spark.sql.files.ignoreMissingFiles   true
spark.sql.files.ignoreCorruptFiles   true

# Local jars (no remote package downloads)
spark.jars /opt/spark/jars-extra/iceberg-spark-runtime-3.5_2.12-1.5.1.jar,/opt/spark/jars-extra/hadoop-aws-3.3.4.jar,/opt/spark/jars-extra/aws-java-sdk-bundle-1.12.262.jar,/opt/spark/jars-extra/spark-sql-kafka-0-10_2.12-3.5.5.jar,/opt/spark/jars-extra/spark-token-provider-kafka-0-10_2.12-3.5.5.jar,/opt/spark/jars-extra/kafka-clients-3.4.1.jar,/opt/spark/jars-extra/lz4-java-1.8.0.jar,/opt/spark/jars-extra/snappy-java-1.1.10.5.jar,/opt/spark/jars-extra/slf4j-api-2.0.7.jar,/opt/spark/jars-extra/hadoop-client-runtime-3.3.4.jar,/opt/spark/jars-extra/hadoop-client-api-3.3.4.jar,/opt/spark/jars-extra/commons-logging-1.1.3.jar,/opt/spark/jars-extra/jsr305-3.0.0.jar,/opt/spark/jars-extra/commons-pool2-2.11.1.jar,/opt/spark/jars-extra/wildfly-openssl-1.0.7.Final.jar,/opt/spark/jars-extra/bundle-2.24.8.jar
