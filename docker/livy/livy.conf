# Livy server settings
livy.server.host=0.0.0.0
livy.server.port=8998

# Enable the built-in Livy UI
livy.ui.enabled=true

# Spark settings used by Livy sessions
livy.spark.master=spark://spark-master:7077
livy.spark.deploy-mode=client

# Session lifecycle (adjust as needed)
livy.server.session.timeout=2h
livy.server.session.timeout-check=1m
