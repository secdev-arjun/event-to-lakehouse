{
  "version": "v1",
  "description": "Normalization rules for org/site fields used to build gold entity keys.",
  "org_site_rules": [
    {
      "id": "split_org_site_dash",
      "description": "Split strings like 'Securado - Head Office' into org/site.",
      "source_fields": [
        "organization",
        "org",
        "company",
        "accountName",
        "site",
        "siteName",
        "location",
        "groupName"
      ],
      "split": {
        "delimiter": "-",
        "trim": true,
        "org_index": 0,
        "site_index": 1
      }
    }
  ],
  "org_aliases": {
    "Securado": [
      "Securado",
      "Securado HQ",
      "Securado - HQ",
      "Securado HO",
      "Securado - HO",
      "Securado HeadOffice",
      "Securado - Head Office",
      "Securado Head Office"
    ]
  },
  "site_aliases": {
    "HeadOffice": [
      "Head Office",
      "HeadOffice",
      "HQ",
      "H.Q.",
      "HO"
    ]
  }
}
