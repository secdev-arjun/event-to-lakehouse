{
  "source_table": "iceberg.silver.assets",
  "target_table": "iceberg.silver.assets_conformed",
  "fields": {
    "schema_version": { "type": "string", "nullable": true },
    "entity_key_str": { "type": "string", "nullable": true },
    "entity_key_hash": { "type": "string", "nullable": true },
    "payload_hash": { "type": "string", "nullable": true },
    "topic_name": { "type": "string", "nullable": true },
    "vendor_id": { "type": "string", "nullable": true },
    "ingest_ts": { "type": "timestamp", "nullable": true },
    "first_seen_at": { "type": "timestamp", "nullable": true },
    "last_seen_at": { "type": "timestamp", "nullable": true },
    "source_updated_at": { "type": "timestamp", "nullable": true },
    "event_time": { "type": "timestamp", "nullable": true },

    "asset_uid": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "source_system": { "type": "string", "nullable": true, "rules": [{"op": "trim"}, {"op": "lower"}] },
    "rapid7_id": { "type": "string", "nullable": true },
    "fortisiem_id": { "type": "string", "nullable": true },
    "asset_name": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "primary_hostname": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "primary_ip": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "access_ip": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "natural_id": { "type": "string", "nullable": true },
    "approved": { "type": "boolean", "nullable": true },
    "unmanaged": { "type": "boolean", "nullable": true },

    "device_vendor": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "device_model": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "device_version": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },

    "os_name": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "os_family": {
      "type": "string",
      "nullable": true,
      "rules": [
        {"op": "trim"},
        {"op": "lower"},
        {"op": "map", "values": {"win": "Windows", "windows": "Windows", "linux": "Linux", "mac": "MacOS", "macos": "MacOS", "darwin": "MacOS"}, "default": null}
      ]
    },
    "os_vendor": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "os_product": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "os_version": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "os_architecture": {
      "type": "string",
      "nullable": true,
      "rules": [
        {"op": "trim"},
        {"op": "lower"},
        {"op": "regex_replace", "pattern": "\\s+", "replacement": ""},
        {"op": "map", "values": {"64bit": "x86_64", "x64": "x86_64", "x86_64": "x86_64", "amd64": "x86_64", "arm64": "arm64", "aarch64": "arm64"}, "default": null}
      ]
    },
    "os_certainty": { "type": "double", "nullable": true },

    "assessed_for_policies": { "type": "boolean", "nullable": true },
    "assessed_for_vulnerabilities": { "type": "boolean", "nullable": true },
    "risk_score": {
      "type": "double",
      "nullable": true,
      "rules": [
        {"op": "scale_if_gt", "value": 10, "factor": 0.1}
      ]
    },
    "raw_risk_score": { "type": "double", "nullable": true },

    "vuln_total": { "type": "int", "nullable": true },
    "vuln_critical": { "type": "int", "nullable": true },
    "vuln_severe": { "type": "int", "nullable": true },
    "vuln_moderate": { "type": "int", "nullable": true },
    "vuln_exploits": { "type": "int", "nullable": true },
    "vuln_malware_kits": { "type": "int", "nullable": true },

    "host_domain": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "ip_addresses": {
      "type": "array<string>",
      "nullable": true,
      "rules": [
        {"op": "array_filter_nulls"},
        {"op": "array_distinct"},
        {"op": "array_sort"}
      ]
    },
    "external_ip": { "type": "string", "nullable": true, "rules": [{"op": "trim"}] },
    "cpu_count": { "type": "int", "nullable": true },
    "memory_bytes": { "type": "bigint", "nullable": true },
    "posture_is_active": { "type": "boolean", "nullable": true },
    "posture_firewall_enabled": { "type": "boolean", "nullable": true },
    "posture_network_quarantine_enabled": { "type": "boolean", "nullable": true },
    "posture_active_threats": { "type": "int", "nullable": true },
    "tags": {
      "type": "array<string>",
      "nullable": true,
      "rules": [
        {"op": "array_filter_nulls"},
        {"op": "array_distinct"},
        {"op": "array_sort"}
      ]
    },

    "raw_payload": { "type": "string", "nullable": true },
    "raw_json": { "type": "string", "nullable": true }
  }
}
