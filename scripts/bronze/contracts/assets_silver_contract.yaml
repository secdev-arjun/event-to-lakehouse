          "pattern": "(?i)^securado headoffice$",
          "replacement": "Securado"
        },
        {
          "op": "regex_replace",
          "pattern": "(?i)^securado - head office$",
          "replacement": "Securado"
        },
        {
          "op": "regex_replace",
          "pattern": "(?i)^securado head office$",
          "replacement": "Securado"
        },
        {
          "op": "regex_replace",
          "pattern": "(?i)^securado-in$",
