      "perf_mon_status",
      "update_method",
      "services_count",
      "software_count"
    ],
    "org_map_matched_test": {
      "mode": "informational",
      "description": "Count is logged per source; zero is valid when names already match normalized output."
    },
    "gold_matching_exclusions": [
      "gateway_mac_addresses",
      "virtual_mac_addresses",
